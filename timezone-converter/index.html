<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムゾーン変換ツール - 便利ツール＆ユーティリティ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>タイムゾーン変換ツール</h1>
        <p>複数のタイムゾーン間での時刻変換を簡単に行えるツールです</p>
    </header>
    
    <nav>
        <ul>
            <li><a href="../index.html">ホームに戻る</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="tool-card">
            <h2>現在の時刻</h2>
            <div id="current-time" class="current-time"></div>
            
            <div class="converter-container">
                <div class="conversion-group">
                    <h3>詳細変換</h3>
                    <div class="input-row">
                        <div class="field">
                            <label for="input-datetime">日時指定：</label>
                            <input type="datetime-local" id="input-datetime">
                        </div>
                        <div class="field">
                            <button id="current-time-btn">現在時刻に設定</button>
                        </div>
                    </div>

                    <div class="timezone-selection-row">
                        <div class="field">
                            <label for="input-timezone">変換元：</label>
                            <select id="input-timezone" class="tz-select"></select>
                        </div>
                        <div class="swap-action">
                            <button id="swap-btn" title="入れ替え">⇄</button>
                        </div>
                        <div class="field">
                            <label for="target-timezone">変換先：</label>
                            <select id="target-timezone" class="tz-select"></select>
                        </div>
                    </div>

                    <div class="result-display">
                        <div id="specific-result" class="result-text">---</div>
                        <button id="copy-btn">結果をコピー</button>
                    </div>
                </div>

                <div class="global-overview">
                    <h3>主要都市の時刻一覧</h3>
                    <div id="conversion-results" class="results-grid"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 personal project for m-shiono</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
